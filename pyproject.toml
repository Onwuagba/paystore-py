[tool.poetry]
name = "paystore"
version = "0.1.0"
description = "A unified Python library for integrating multiple payment providers"
authors = ["Onwuagba <onwuagbakenenna@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/onwuagba/paystore"
repository = "https://github.com/onwuagba/paystore"
documentation = "https://github.com/onwuagba/paystore/tree/main/docs"
keywords = ["payment", "gateway", "paystack", "flutterwave", "stripe"]
include = ["paystore/py.typed"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business :: Financial",
]

[tool.poetry.dependencies]
python = "^3.8"
httpx = "^0.25.0"
pydantic = "^2.0.0"
python-dotenv = "^1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
black = "^23.0.0"
ruff = "^0.1.0"
mypy = "^1.5.0"
pre-commit = "^3.5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=paystore --cov-report=html --cov-report=term-missing"

[tool.black]
line-length = 88
target-version = ["py38"]

[tool.ruff]
line-length = 88
select = ["E", "F", "I", "C", "B"]
