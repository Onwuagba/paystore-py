[tool.poetry]
name = "paystore-django"
version = "0.2.0"
description = "Django integration for paystore: settings-based Gateway factory and a webhook view"
authors = ["Onwuagba <onwuagbakenenna@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/onwuagba/paystore-py"
repository = "https://github.com/onwuagba/paystore-py"
keywords = ["payment", "gateway", "django", "paystack", "flutterwave", "stripe"]
packages = [{ include = "paystore_django" }]

[tool.poetry.dependencies]
python = "^3.8"
django = ">=3.2"
paystore = ">=0.2.0,<0.4.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-django = "^4.5.0"
pytest-asyncio = "^0.21.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "paystore_django_tests.settings"
testpaths = ["paystore_django_tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.black]
line-length = 88
target-version = ["py38"]

[tool.ruff]
line-length = 88
select = ["E", "F", "I", "C", "B"]
